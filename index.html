<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Request Demo</title><style>body{font-family:Arial;margin:0;background:#f4f6f8;color:#172033}.h{background:#111827;color:#fff;padding:18px;font-size:20px;font-weight:700}.w{max-width:900px;margin:auto;padding:14px}.c{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}input,select,button{width:100%;padding:12px;margin:6px 0 10px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{background:#2563eb;color:#fff;border:0;font-weight:bold}.tabs{display:flex;gap:8px}.tabs button{flex:1}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#f8fafc;padding:12px;border-radius:10px}.stat b{display:block;font-size:20px;margin-top:4px}.row{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:8px}.badge{padding:5px 8px;border-radius:20px;font-size:12px;font-weight:bold}.Pending{background:#fff1bd}.Paid{background:#d9f7e5;color:#08733a}.Rejected{background:#ffe0e0;color:#a00}.small{font-size:12px;color:#667085}</style></head><body><div class="h">Payment Request System — Mobile Demo</div><div class="w"><div class="tabs"><button onclick="panel('a')">Agent Panel</button><button onclick="panel('d')">Admin Panel</button></div><section id="a"><div class="c"><h2>New Payment Request</h2><input id="client" placeholder="Client / Shop Name"><input id="mobile" placeholder="Mobile Number"><input id="holder" placeholder="Bank Account Holder Name"><input id="bank" placeholder="Bank Name"><input id="account" placeholder="Account Number"><input id="amount" type="number" placeholder="Amount"><button onclick="add()">Submit Request</button><div id="msg" class="small"></div></div><div class="c"><h2>My Last 72 Hours</h2><div id="stats" class="grid"></div><div id="mine"></div></div></section><section id="d" class="hide"><div class="c"><h2>Admin Dashboard</h2><div id="astats" class="grid"></div></div><div class="c"><h2>All Transactions</h2><input id="q" oninput="adminRender()" placeholder="Search reference, client, bank, agent"><select id="filter" onchange="adminRender()"><option>All</option><option>Pending</option><option>Paid</option><option>Rejected</option></select><div id="all"></div><button onclick="csv()">Export CSV</button></div></section></div><script>const K='prs_demo';let d=JSON.parse(localStorage.getItem(K)||'[]');if(!d.length){d=[{ref:'PR-00125',client:'Demo Shop A',bank:'SBI',account:'4521',amount:25000,status:'Pending',agent:'Agent 1',time:Date.now()-3600000},{ref:'PR-00124',client:'Demo Shop B',bank:'HDFC Bank',account:'8214',amount:15000,status:'Paid',agent:'Agent 2',time:Date.now()-90000000}];save()}function save(){localStorage.setItem(K,JSON.stringify(d))}function panel(x){a.classList.toggle('hide',x!='a');document.getElementById('d').classList.toggle('hide',x!='d');x=='a'?agentRender():adminRender()}function add(){let vs=[client.value,mobile.value,holder.value,bank.value,account.value,amount.value];if(vs.some(v=>!v)||Number(amount.value)<=0){msg.textContent='Please fill all fields.';return}let r='PR-'+Date.now().toString().slice(-8);d.unshift({ref:r,client:client.value,bank:bank.value,account:account.value.slice(-4),amount:Number(amount.value),status:'Pending',agent:'Agent 1',time:Date.now()});save();[client,mobile,holder,bank,account,amount].forEach(x=>x.value='');msg.textContent='Submitted. Reference: '+r;agentRender();adminRender()}function money(n){return '₹'+n.toLocaleString('en-IN')}function badge(s){return '<span class="badge '+s+'">'+s+'</span>'}function agentRender(){let r=d.filter(x=>x.agent=='Agent 1'&&x.time>=Date.now()-72*3600000),p=r.filter(x=>x.status=='Paid').reduce((a,x)=>a+x.amount,0),n=r.filter(x=>x.status=='Pending').reduce((a,x)=>a+x.amount,0);stats.innerHTML='<div class="stat">Requests<b>'+r.length+'</b></div><div class="stat">Paid<b>'+money(p)+'</b></div><div class="stat">Pending<b>'+money(n)+'</b></div>';mine.innerHTML=r.map(x=>'<div class="row"><div><b>'+x.ref+'</b><br>'+x.client+' • '+money(x.amount)+'<div class="small">'+new Date(x.time).toLocaleString()+' • '+x.bank+' • ****'+x.account+'</div></div>'+badge(x.status)+'</div>').join('')||'<p class="small">No transactions in last 72 hours.</p>'}function adminRender(){let s=(q.value||'').toLowerCase(),f=filter.value,r=d.filter(x=>(f=='All'||x.status==f)&&(!s||(x.ref+x.client+x.bank+x.agent).toLowerCase().includes(s))),p=d.filter(x=>x.status=='Paid').reduce((a,x)=>a+x.amount,0),n=d.filter(x=>x.status=='Pending').reduce((a,x)=>a+x.amount,0);astats.innerHTML='<div class="stat">Requests<b>'+d.length+'</b></div><div class="stat">Paid<b>'+money(p)+'</b></div><div class="stat">Pending<b>'+money(n)+'</b></div><div class="stat">Rejected<b>'+d.filter(x=>x.status=='Rejected').length+'</b></div>';all.innerHTML=r.map(x=>'<div class="row"><div><b>'+x.ref+'</b><br>'+x.agent+' • '+x.client+' • '+money(x.amount)+'<div class="small">'+x.bank+' • ****'+x.account+'</div></div><div>'+badge(x.status)+(x.status=='Pending'?'<button onclick="status(\''+x.ref+'\',\'Paid\')">Paid</button><button onclick="status(\''+x.ref+'\',\'Rejected\')">Reject</button>':'')+'</div></div>').join('')}function status(r,s){let x=d.find(x=>x.ref==r);x.status=s;save();adminRender();agentRender()}function csv(){let t='Date,Reference,Agent,Client,Bank,AccountLast4,Amount,Status\n'+d.map(x=>[new Date(x.time).toLocaleString(),x.ref,x.agent,x.client,x.bank,x.account,x.amount,x.status].join(',')).join('\n');let z=document.createElement('a');z.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));z.download='payment-statement.csv';z.click()}agentRender();adminRender()</script></body></html>
